<!DOCTYPE html>
<html>
    <head>
        <title>Text Dice</title>
    </head>
    <body>
        <h1>Text Dice</h1>
        <p>Click the button to roll the dice:</p>
        <button onclick="rollDice()">Roll Dice</button>
        <p id="dice"></p>
        <script>
            let words = ["", "one", "two", "three", "four", "five", "six"];
            function rollDice() {
                let dice = Math.floor(Math.random() * 6) + 1;
                document.getElementById("dice").innerHTML = "You rolled a " + words[dice];
            }
        </script>
    </body>
</html>
