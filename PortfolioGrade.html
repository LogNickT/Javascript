<!DOCTYPE html>
<html>
<head>
    <title>Question 1</title>
</head>
<body>
    <p2>Enter mark for Analysis section</p2>
    <input type="number" id="ana" value="5"><br>
    <p2>Enter mark for Design section</p2>
    <input type="number" id="des" value="5"><br>
    <p2>Enter mark for Implementation section</p2>
    <input type="number" id="imp" value="5"><br>
    <p2>Enter mark for Evaluation section</p2>
    <input type="number" id="eva" value="5"><br>
    <button onclick="TotalMark()">Add</button>
    <p id="total"></p>
    <script>
        function TotalMark() {
            let a = document.getElementById("ana").value;
            let b = document.getElementById("des").value;
            let c = document.getElementById("imp").value;
            let d = document.getElementById("eva").value;
            let totalmarks = Number(c) + Number(d) + Number(a) + Number(b);
            document.getElementById("total").innerHTML = "Your total mark is " + String(totalmarks);
            let grade;    
        
            if (totalmarks < 4) {
                grade = "U"
                needed = 4 - totalmarks
            } else if (totalmarks < 13) {
                grade = "G"
                needed = 13 - totalmarks
            } else if (totalmarks < 22) {
                grade = "F"
                needed = 22 - totalmarks
            } else if (totalmarks < 31) {
                grade = "E"
                needed = 31 - totalmarks
            } else if (totalmarks < 41) {
                grade = "D"
                needed = 41 - totalmarks
            } else if (totalmarks < 54) {
                grade = "C"
                needed = 54 - totalmarks
            } else if (totalmarks < 67) {
                grade = "B"
                needed = 67 - totalmarks
            } else if (totalmarks < 80) {
                grade = "A"
                needed = 80 - totalmarks;
            } else {
                grade = "A*";
                needed = 0;
            }
            document.getElementById("total").innerHTML = "Your total mark is " + totalmarks + " and your grade is " + grade;
            if (grade === "A*") {
                document.getElementById("total").innerHTML += " and you have achieved the highest grade";
            } else {
                document.getElementById("total").innerHTML += " and you need " + needed + " more marks to achieve the next grade.";
            }}
    </script>

</body>


</html>
