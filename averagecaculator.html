<!DOCTYPE html>
<html>
<head>
    <title>Question 1</title>
</head>
<body>
<label>How many numbers do you want to average?</label>
<input type="number" id="numCount" min="1" step="1" value="2">
<button onclick="addNumbers()">Calculate Average</button>
<p id="result"></p>

    <script>
        function addNumbers() {
            let count = Number(document.getElementById("numCount").value);
            if (!Number.isInteger(count) || count < 1) {
                document.getElementById("result").innerHTML = "Please enter a valid positive integer for the number of values.";
                return;
            }
            let sum = 0;
            for (let i = 1; i <= count; i++) {
                let num = prompt("Enter number " + i + ":");
                sum += Number(num);
            }
            let average = sum / count;
            document.getElementById("result").innerHTML = "Total: "  + String(sum) + "<br>Average: " + String(average);
        }
    </script>

</body>


</html>
